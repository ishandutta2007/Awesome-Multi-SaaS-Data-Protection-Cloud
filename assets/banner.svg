<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent glow gradients -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .grid-line {
        stroke: #334155;
        stroke-width: 0.5;
        stroke-opacity: 0.25;
      }
      .orbit-particle {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .shield-pulse {
        animation: shieldPulse 3.5s ease-in-out infinite;
        transform-origin: 980px 175px;
      }
      .stream-flow {
        stroke-dasharray: 8 12;
        animation: streamMove 6s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite alternate;
      }

      @keyframes floatOrb {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
        100% { transform: translateY(8px) translateX(-10px); }
      }
      @keyframes shieldPulse {
        0% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(0,242,254,0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(56,239,125,0.7)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(0,242,254,0.4)); }
      }
      @keyframes streamMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes badgePulse {
        0% { opacity: 0.85; }
        100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(0,242,254,0.6)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Ambient Glows -->
  <rect width="1200" height="360" rx="16" fill="url(#glow-cyan)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow-purple)" />

  <!-- Geometric Grid Pattern in Background -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Data Streams in Background (Non-intrusive) -->
  <g opacity="0.35">
    <path class="stream-flow" d="M -50 80 Q 300 20 650 90 T 1250 50" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="stream-flow" d="M -50 310 Q 400 350 800 290 T 1250 320" fill="none" stroke="#38ef7d" stroke-width="2" />
    <path class="stream-flow" d="M 850 -20 Q 980 140 1020 380" fill="none" stroke="#7928ca" stroke-width="1.5" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="180" cy="85" r="4" fill="#00f2fe" opacity="0.6" class="orbit-particle" />
  <circle cx="720" cy="65" r="5" fill="#38ef7d" opacity="0.5" class="orbit-particle" />
  <circle cx="640" cy="310" r="3.5" fill="#a78bfa" opacity="0.7" class="orbit-particle" />
  <circle cx="1120" cy="90" r="6" fill="#38bdf8" opacity="0.4" class="orbit-particle" />

  <!-- Right Visual Feature: Dynamic Air-Gapped Cloud / Shield Security Icon (Kept safely on right) -->
  <g class="shield-pulse">
    <!-- Outer Shield Halo -->
    <path d="M 980 85 L 1050 115 C 1050 185 980 235 980 250 C 980 235 910 185 910 115 Z" 
          fill="none" stroke="url(#title-grad)" stroke-width="3" opacity="0.85" />
    <!-- Inner Shield Fill -->
    <path d="M 980 95 L 1040 122 C 1040 180 980 224 980 236 C 980 224 920 180 920 122 Z" 
          fill="#111827" fill-opacity="0.7" stroke="#38ef7d" stroke-width="1.5" />
    <!-- Cloud & Lock Symbols Inside -->
    <path d="M 960 165 A 15 15 0 0 1 988 155 A 20 20 0 0 1 1012 168 A 12 12 0 0 1 1008 185 L 956 185 A 12 12 0 0 1 960 165 Z"
          fill="#00f2fe" opacity="0.9" />
    <rect x="971" y="180" width="18" height="14" rx="3" fill="#38ef7d" />
    <path d="M 975 180 L 975 174 A 5 5 0 0 1 985 174 L 985 180" fill="none" stroke="#38ef7d" stroke-width="2.5" />
    <!-- Air-Gap Arc Rings -->
    <circle cx="980" cy="175" r="82" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="980" cy="175" r="98" fill="none" stroke="#7928ca" stroke-width="1" stroke-dasharray="10 14" opacity="0.3" />
  </g>

  <!-- FOREGROUND CONTENT: Safe & Clearly Legible on Left & Center -->

  <!-- Top Pill / Status Tag -->
  <g class="badge-glow" transform="translate(60, 42)">
    <rect width="320" height="30" rx="15" fill="url(#pill-grad)" stroke="#38ef7d" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#38ef7d">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
      ENTERPRISE SAAS &amp; OPEN-SOURCE BAAS
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="125" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome Multi-SaaS Data Protection
  </text>
  <text x="60" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" filter="url(#shadow)">
    Cloud &amp; Cyber Resilience Matrix
  </text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="208" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Curated backup, disaster recovery, immutable air-gapping, &amp; data governance platforms
  </text>
  <text x="60" y="230" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Protecting Microsoft 365 • Google Workspace • Salesforce • GitHub • Cloud Databases
  </text>

  <!-- Feature Pills / Highlights across bottom -->
  <g transform="translate(60, 275)">
    <!-- Pill 1: Immutable Backups -->
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="18" y="21" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Immutable Storage</text>

    <!-- Pill 2: Multi-SaaS Recovery -->
    <rect x="175" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="190" y="21" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Instant Granular Restore</text>

    <!-- Pill 3: Ransomware Resilience -->
    <rect x="355" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="372" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔒 Ransomware Isolation</text>

    <!-- Pill 4: Zero Vendor Lock-in -->
    <rect x="550" y="0" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="568" y="21" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 100% Data Sovereignty</text>
  </g>
</svg>
